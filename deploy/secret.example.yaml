# This file lives outside deploy/k8s/ on purpose: that directory is applied wholesale,
# and an example secret inside it would clobber the real one with the placeholder
# below on every re-apply.
apiVersion: v1
kind: Secret
metadata:
  name: coyote
type: Opaque
stringData:
  secret: "REPLACE_ME"
