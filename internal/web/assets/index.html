<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SwiftIRC VC</title>
  <!-- __ASSET_VERSION__ is substituted with the build's asset digest when the shell is
       served, so every redeploy changes these URLs and no cache can serve stale code.
       app.js's imports are all RELATIVE, so the whole module graph inherits the prefix. -->
  <!-- Version-stamped so a redeploy replaces it; browsers also request a bare
       /favicon.ico with no link tag at all, and the embedded file answers that too. -->
  <link rel="icon" href="/v/__ASSET_VERSION__/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="stylesheet" href="/v/__ASSET_VERSION__/style.css">
</head>
<body>
  <div id="app"></div>
  <!-- The photographic background scenes this build embedded, injected by the server
       from assets/img/ (see internal/server/scenes.go). A classic script runs before
       the deferred module below, so lib/backgrounds.js can read it synchronously and
       the effect catalogue is complete by the time anything resolves a saved
       preference against it. An empty array simply means no Scenes row. -->
  <script>window.__vcScenes = __BACKGROUND_SCENES__;</script>
  <script type="module" src="/v/__ASSET_VERSION__/app.js"></script>
</body>
</html>
